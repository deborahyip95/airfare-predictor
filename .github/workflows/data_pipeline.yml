name: Scheduled Flight Data Pipeline

on:
  schedule:
    # Checks in daily at 22:00 UTC (06:00 SGT); the "Roll the dice" step below decides
    # whether the rest of the job actually runs, averaging ~2 random days a week.
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab (always runs, no dice roll)

permissions:
  contents: write   # needed so the job can commit the refreshed dataset/model back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Roll the dice (~2 random days/week)
        id: decide
        run: |
          # Manual runs always go ahead. Scheduled runs only proceed with probability 2/7,
          # so across a week this fires on ~2 random days on average (not a fixed count).
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
          elif [ "$((RANDOM % 7))" -lt 2 ]; then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_today=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.decide.outputs.run_today == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.decide.outputs.run_today == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.decide.outputs.run_today == 'true'
        run: pip install -r requirements.txt

      - name: Extract and process flight data
        if: steps.decide.outputs.run_today == 'true'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python pipeline/extraction_process.py

      - name: Train model
        if: steps.decide.outputs.run_today == 'true'
        run: python pipeline/ml.py

      - name: Update README with latest metrics
        if: steps.decide.outputs.run_today == 'true'
        run: python pipeline/update_readme.py

      - name: Commit and push updated data, model & README
        if: steps.decide.outputs.run_today == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data src/flight_predictor_rf.joblib src/model_feature_schema.joblib README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: scheduled pipeline run $(date -u +'%Y-%m-%d')"
            git push
          fi
